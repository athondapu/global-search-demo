[project]
name = "lumen-lab-tools"
version = "0.7.0"
description = "CLI and starter code for the Lumen Labs Agent Engineering Training Program"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
lab = "lab.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
